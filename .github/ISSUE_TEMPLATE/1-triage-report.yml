name: Triage report
description: Filed by a coding agent (Claude Code, Codex or another) that looked into the problem on your machine. This is the preferred way to report a problem.
labels:
  - via-triage
body:
  - type: markdown
    attributes:
      value: |
        Agents follow this structure when they file a triage report. Keep one problem per
        issue. Strip tokens, API keys, AniList or MyAnimeList credentials and home directory
        paths from anything pasted here.

        No agent? Use the **Bug report** form instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The problem in the user's own words.
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis
      description: What the investigation found, grounded in logs, the database and source.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal, deterministic repro if one was found.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of AniBeam the problem is in.
      options:
        - Library and scanning
        - Matching and metadata
        - Playback
        - AniList or MyAnimeList sync
        - Franchise graph
        - Downloads
        - Android companion or tailnet host
        - Install, startup or packaging
        - Command line (anibeam-cli)
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The AniBeam version the problem happened on, from `anibeam --version` or Settings > Data > About, or "unknown".
      placeholder: 2.0.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How AniBeam is installed
      options:
        - AUR package
        - AppImage
        - macOS app (dmg)
        - Built from source
        - Android companion
        - Unknown
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, desktop or compositor, GPU and driver, Qt and libmpv versions where they matter.
      placeholder: Arch Linux, Hyprland 0.56, RTX 3090 driver 580, Qt 6.11, libmpv 0.40
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The most relevant log lines, activity log entries, database rows or backtraces. Redacted.
      render: shell

  - type: input
    id: related
    attributes:
      label: Related issues
      description: Existing issues that look similar, and why this one is not a duplicate.

  - type: textarea
    id: workaround
    attributes:
      label: Fix applied or workaround
      description: Anything that was run on the machine to unblock the user.

  - type: input
    id: agent
    attributes:
      label: Filed by
      description: The agent and model that produced this report.
      placeholder: Claude Code (claude-opus-5-5)
    validations:
      required: true
