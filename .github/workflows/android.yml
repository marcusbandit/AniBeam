name: Android

# The phone app's own checks. apps/android is its own Cargo workspace, so ci.yml never builds
# it, and its tests and clippy drifted on main unnoticed (#449). A pull request that touches the
# phone, or the core it builds on, runs its lib tests on the host, which needs no NDK, and
# clippy for the emulator's target, which does. The runner image ships the Android SDK and NDK.
# scripts/build.sh sets the NDK's linkers and C compilers; ANIBEAM_BUILD_SCOPED skips its
# systemd memory cap, which a runner has no user session for.
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'core/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANIBEAM_BUILD_SCOPED: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.98 --profile minimal --component clippy
          rustup default 1.98
          rustup target add x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/android

      - name: Test
        run: scripts/build.sh cargo test --locked --lib

      - name: libmpv
        run: scripts/fetch-mpv.sh

      - name: Clippy
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" JAVA_HOME="$JAVA_HOME_17_X64"
          scripts/build.sh cargo clippy --locked --release --lib --target x86_64-linux-android -- -D warnings
