name: Android

# The phone app's own checks. apps/phone is its own Cargo workspace, so ci.yml never builds
# it, and its tests and clippy drifted on main unnoticed (#449). A pull request that touches the
# phone or what it builds on (the core, host-api, the root manifest it inherits from) runs the
# whole phone workspace's tests and clippy on the host, which needs no NDK, then clippy for the
# emulator's target, which does. The runner image ships the Android SDK and NDK.
# scripts/build.sh sets the NDK's linkers and C compilers; ANIBEAM_BUILD_SCOPED skips its
# systemd memory cap, which a runner has no user session for. Runs on main too, so rust-cache
# keeps a cache every pull request can restore. The paths name every crate the phone builds
# on, which `affected-crates.py --self-test` in ci.yml holds to the workspace (#974).
on:
  push:
    branches: [main]
    paths:
      - 'apps/phone/**'
      - 'contract/**'
      - 'foundation/**'
      - 'net/**'
      - 'library/**'
      - 'releases/**'
      - 'metadata/**'
      - 'trackers/**'
      - 'downloads/**'
      - 'playback/**'
      - 'host/**'
      - 'core/**'
      - 'host-api/**'
      - 'recs/**'
      - 'room/**'
      - 'i18n/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/phone/**'
      # PRs opened before the move (#1309) still list apps/android; drop once they merge main.
      - 'apps/android/**'
      - 'contract/**'
      - 'foundation/**'
      - 'net/**'
      - 'library/**'
      - 'releases/**'
      - 'metadata/**'
      - 'trackers/**'
      - 'downloads/**'
      - 'playback/**'
      - 'host/**'
      - 'core/**'
      - 'host-api/**'
      - 'recs/**'
      - 'room/**'
      - 'i18n/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/android.yml'
      # An iPhone-only change cannot affect this (#950): the paths ios-automerge.sh counts as
      # iPhone only, the same list as its ONLY regex, so a path added there is added here too.
      # Later patterns win, so these stay after the positive ones.
      - '!apps/phone/ios/**'
      - '!apps/phone/src/**/ios.rs'
      - '!apps/phone/src/**/ios/**'
      - '!apps/phone/src/**/metal.rs'
      - '!apps/phone/src/**/metal/**'
      - '!apps/phone/scripts/*ios*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANIBEAM_BUILD_SCOPED: '1'

jobs:
  # rustfmt alone, so a formatting slip fails in seconds without waiting on the build (#510).
  # The phone workspace is not a member of the root one, so ci.yml's fmt job never sees it.
  # Its two packages by name: --all would follow the path dependencies into core/ and the
  # rest of the root workspace, which ci.yml already checks.
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install
          # A runner can hold a partial toolchain without rustc (#674)
          rustup component add rustc cargo rust-std

      - run: cargo fmt --check -p anibeam-android -p anibeam-companion

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - uses: actions/checkout@v4

      # Slint's host build links fontconfig; the Android build carries its own fonts.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install
          # A runner can hold a partial toolchain without rustc (#674)
          rustup component add rustc cargo rust-std
          rustup target add x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves (#986): a PR restores main's cache and saves none, so PR caches no
          # longer push the repo past its 10 GB and evict the ones every PR needs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: apps/phone

      - name: Test
        run: scripts/build.sh cargo test --locked --workspace

      # Every crate and every test module, on a target where every lint works.
      - name: Clippy (host)
        run: scripts/build.sh cargo clippy --locked --workspace --all-targets -- -D warnings

      # vendor/ is about 60 MB of pinned mpv-android libraries; the script refetches only
      # when its pinned tag changes.
      - uses: actions/cache@v4
        with:
          path: apps/phone/vendor/mpv
          key: mpv-${{ hashFiles('apps/phone/scripts/fetch-mpv.sh') }}

      - name: libmpv
        run: scripts/fetch-mpv.sh

      - name: Clippy (Android)
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" JAVA_HOME="$JAVA_HOME_17_X64"
          scripts/build.sh cargo clippy --locked --release --lib --target x86_64-linux-android -- -D warnings
