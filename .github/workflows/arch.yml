name: Arch

# The tarball the AUR's anibeam-bin installs (#235). It is built in an Arch container, not on
# the Ubuntu runner linux.yml uses, because the binary links against the system's Qt, MpvQt and
# libmpv, and anibeam-bin depends on Arch's. release.yml calls it so every stable release
# carries AniBeam-<version>-linux-x86_64.tar.zst and its .sha256, and nightly.yml calls it so
# a rolling Arch update that breaks the container build shows up on the next nightly rather
# than on a release. A pull request builds it under the `full ci` label, once before merge.
# Its pull request paths are linux.yml's: whatever can break the shell's build in the
# container breaks it here too.
on:
  # A pull request runs it once, when it gets the `full ci` label, never on each push (#986).
  # The fast checks in ci.yml run on every push; take the label off and put it back to build
  # the newest push again.
  pull_request:
    types: [labeled]
    paths:
      - 'contract/**'
      - 'foundation/**'
      - 'net/**'
      - 'core/**'
      - 'host-api/**'
      - 'apps/linux/**'
      - 'apps/cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/arch.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''

permissions:
  contents: read

# A newer push to the same pull request cancels the older run, as in linux.yml (#529); any
# other run, a release's among them, has a group of its own.
concurrency:
  group: ${{ github.workflow }}-arch-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.label.name }}
  cancel-in-progress: true

env:
  ANIBEAM_RELEASE_VERSION: ${{ inputs.version }}
  CARGO_TERM_COLOR: always
  # As in linux.yml: the project's own app registrations, so the release signs in with one click.
  ANIBEAM_ANILIST_CLIENT_ID: ${{ secrets.ANIBEAM_ANILIST_CLIENT_ID }}
  ANIBEAM_MAL_CLIENT_ID: ${{ secrets.ANIBEAM_MAL_CLIENT_ID }}
  ANIBEAM_DISCORD_CLIENT_ID: ${{ secrets.ANIBEAM_DISCORD_CLIENT_ID }}

jobs:
  tarball:
    # Any label fires the pull_request event; only `full ci` builds. A run another workflow
    # calls (nightly, release, a PR test build) always builds.
    if: github.event_name != 'pull_request' || inputs.version != '' || github.event.label.name == 'full ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: archlinux:base-devel
    steps:
      - name: Packages
        # What the anibeam PKGBUILD builds with, plus git for the version and zstd to pack.
        run: |
          pacman -Syu --noconfirm --needed git rust lld qt6-base qt6-declarative qt6-svg \
            mpvqt mpv zstd

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # git describe names the version

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves (#986): a PR restores main's cache and saves none, so PR caches no
          # longer push the repo past its 10 GB and evict the ones every PR needs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build and pack
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="${ANIBEAM_RELEASE_VERSION:-$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)}"
          apps/linux/packaging/aur/bin-tarball.sh "$version" dist
          tar -tf "dist/AniBeam-$version-linux-x86_64.tar.zst" | head -n 5
          # It runs on the libraries it was linked against: nothing missing, and it starts.
          if ldd target/release/anibeam | grep 'not found'; then exit 1; fi
          target/release/anibeam --version

      - uses: actions/upload-artifact@v4
        with:
          name: anibeam-arch-x86_64
          path: dist/AniBeam-*-linux-x86_64.tar.zst*
          if-no-files-found: error
