name: CI

# Fast checks on every pull request: formatting for the whole workspace, then clippy and
# the tests for the crates the pull request changed and every crate that builds on them
# (.github/affected-crates.py, #1075). The Qt shell (apps/linux, package
# anibeam) needs Qt 6.11, MpvQt, libmpv and lld, which an ubuntu runner lacks, so its
# tests and clippy run in .github/local-ci.sh, and in linux.yml under the `full ci` label
# (#986), which sets those up for the AppImage. Runs on main
# too, so rust-cache keeps a cache every pull request can restore. The toolchain comes from
# rust-toolchain.toml, which every workflow reads (#526).
# A change that only touches markdown or docs/ skips it (#428). The two CHANGELOG.md files
# and the change files in apps/*/changes still run it: the apps compile them in and
# core/tests/changelog.rs checks them. Later patterns win, so those lines have to stay
# after the markdown exclusion.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '**/CHANGELOG.md'
      - 'apps/*/changes/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '**/CHANGELOG.md'
      - 'apps/*/changes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install
          # A runner can hold a partial toolchain without rustc (#674)
          rustup component add rustc cargo rust-std

      - run: cargo fmt --all --check

  # A patch note this pull request adds has to sit under the newest heading (#480). The
  # checkout is the merge commit, so its first parent is the base the PR merges into. A PR
  # that went green before main moved to a new heading can still squash its line under the
  # old one, so main runs it too, against the commit before: then main goes red instead.
  changelog:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - run: .github/changelog-newest.sh HEAD^1

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base it merges into, for the crates
          # the pull request changed.
          fetch-depth: 2

      - name: Rust toolchain
        run: |
          rustup toolchain install
          # A runner can hold a partial toolchain without rustc (#674)
          rustup component add rustc cargo rust-std

      # Only the crates this pull request changed and every crate that builds on them (#1075).
      # The log lists what was picked, why, and what was not checked. Main and a run by hand
      # check every crate, so main keeps the full signal and a cache every PR can restore. The
      # Qt shell (anibeam) needs Qt, which this runner lacks; local-ci.sh checks it.
      - name: Affected crates
        id: affected
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 .github/affected-crates.py --self-test
          if [ "$EVENT" = pull_request ]; then pick=(--base HEAD^1); else pick=(--all); fi
          python3 .github/affected-crates.py "${pick[@]}" --skip anibeam --github-output

      - uses: Swatinem/rust-cache@v2
        if: steps.affected.outputs.crates != ''
        with:
          # Only main saves (#986): a PR restores main's cache and saves none, so PR caches no
          # longer push the repo past its 10 GB and evict the ones every PR needs.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        if: steps.affected.outputs.crates != ''
        env:
          CRATES: ${{ steps.affected.outputs.crates }}
        run: cargo clippy --locked $(printf -- '-p %s ' $CRATES) --all-targets -- -D warnings

      # Each picked crate another one builds on, by itself: one cargo call over several crates
      # merges their features, and would hide a use the crate does not turn on itself, such as
      # rusqlite in the contract, whose sqlite feature only the core turns on.
      - name: Clippy (each crate alone)
        if: steps.affected.outputs.alone != ''
        env:
          ALONE: ${{ steps.affected.outputs.alone }}
        run: |
          status=0
          for crate in $ALONE; do
            echo "::group::$crate alone"
            cargo clippy --locked -p "$crate" --all-targets -- -D warnings || { status=1; echo "::error::clippy $crate alone failed"; }
            echo "::endgroup::"
          done
          exit $status

      # Only the phone build compiles the core's phone and cast features, and no other
      # workflow builds the phone, so without this a desktop change can break the APK and
      # stay green (#309). The host target is enough: these features need no NDK.
      - name: Clippy (phone features)
        if: steps.affected.outputs.core == 'true'
        run: cargo clippy --locked -p anibeam-core --features phone,cast --all-targets -- -D warnings

      # The phone's torrent engine and its tests sit behind the downloads crate's own `phone`
      # feature. The core's `phone` turns it on for the library only, so without this nothing
      # compiles those tests, which the step above did while they were in the core.
      - name: Clippy (downloads with phone)
        if: contains(format(' {0} ', steps.affected.outputs.crates), ' anibeam-downloads ')
        run: cargo clippy --locked -p anibeam-downloads --features phone --all-targets -- -D warnings

      # Casting and its tests sit behind the playback crate's own `cast` feature, for the same
      # reason.
      - name: Clippy (playback with cast)
        if: contains(format(' {0} ', steps.affected.outputs.crates), ' anibeam-playback ')
        run: cargo clippy --locked -p anibeam-playback --features cast --all-targets -- -D warnings

      - name: Test
        if: steps.affected.outputs.crates != ''
        env:
          CRATES: ${{ steps.affected.outputs.crates }}
        run: cargo test --locked $(printf -- '-p %s ' $CRATES)
