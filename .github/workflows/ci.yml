name: CI

# Fast checks on every pull request: formatting for the whole workspace, then clippy and
# the tests for the core and the terminal shell. The Qt shell (apps/linux, package
# anibeam) needs Qt 6.11, MpvQt, libmpv and lld, which an ubuntu runner lacks, so its
# tests and clippy run in .github/local-ci.sh, and in linux.yml under the `full ci` label
# (#986), which sets those up for the AppImage. Runs on main
# too, so rust-cache keeps a cache every pull request can restore. The toolchain comes from
# rust-toolchain.toml, which every workflow reads (#526).
# A change that only touches markdown or docs/ skips it (#428). The two CHANGELOG.md files
# and the change files in apps/*/changes still run it: the apps compile them in and
# core/tests/changelog.rs checks them. Later patterns win, so those lines have to stay
# after the markdown exclusion.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '**/CHANGELOG.md'
      - 'apps/*/changes/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '**/CHANGELOG.md'
      - 'apps/*/changes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install
          # A runner can hold a partial toolchain without rustc (#674)
          rustup component add rustc cargo rust-std

      - run: cargo fmt --all --check

  # A patch note this pull request adds has to sit under the newest heading (#480). The
  # checkout is the merge commit, so its first parent is the base the PR merges into. A PR
  # that went green before main moved to a new heading can still squash its line under the
  # old one, so main runs it too, against the commit before: then main goes red instead.
  changelog:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - run: .github/changelog-newest.sh HEAD^1

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install
          # A runner can hold a partial toolchain without rustc (#674)
          rustup component add rustc cargo rust-std

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves (#986): a PR restores main's cache and saves none, so PR caches no
          # longer push the repo past its 10 GB and evict the ones every PR needs.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked -p anibeam-contract -p anibeam-foundation -p anibeam-net -p anibeam-library -p anibeam-releases -p anibeam-metadata -p anibeam-trackers -p anibeam-downloads -p anibeam-playback -p anibeam-core -p anibeam-host-api -p anibeam-cli --all-targets -- -D warnings

      # The contract alone, without the sqlite feature the core turns on: one cargo call
      # with the core merges their features, and would hide an ungated rusqlite use here.
      - name: Clippy (contract alone)
        run: cargo clippy --locked -p anibeam-contract --all-targets -- -D warnings

      # The foundation alone, for the same reason: a feature of a shared dependency that only
      # the core turns on would build here with the core and fail for the crate on its own.
      - name: Clippy (foundation alone)
        run: cargo clippy --locked -p anibeam-foundation --all-targets -- -D warnings

      - name: Clippy (net alone)
        run: cargo clippy --locked -p anibeam-net --all-targets -- -D warnings

      - name: Clippy (library alone)
        run: cargo clippy --locked -p anibeam-library --all-targets -- -D warnings

      - name: Clippy (releases alone)
        run: cargo clippy --locked -p anibeam-releases --all-targets -- -D warnings

      - name: Clippy (metadata alone)
        run: cargo clippy --locked -p anibeam-metadata --all-targets -- -D warnings

      - name: Clippy (trackers alone)
        run: cargo clippy --locked -p anibeam-trackers --all-targets -- -D warnings

      - name: Clippy (downloads alone)
        run: cargo clippy --locked -p anibeam-downloads --all-targets -- -D warnings

      - name: Clippy (playback alone)
        run: cargo clippy --locked -p anibeam-playback --all-targets -- -D warnings

      # Only the phone build compiles the core's phone and cast features, and no other
      # workflow builds the phone, so without this a desktop change can break the APK and
      # stay green (#309). The host target is enough: these features need no NDK.
      - name: Clippy (phone features)
        run: cargo clippy --locked -p anibeam-core --features phone,cast --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p anibeam-contract -p anibeam-foundation -p anibeam-net -p anibeam-library -p anibeam-releases -p anibeam-metadata -p anibeam-trackers -p anibeam-downloads -p anibeam-playback -p anibeam-core -p anibeam-host-api -p anibeam-cli
