name: iOS

# The iPhone app's own checks (#950). A pull request that touches the iPhone's files or the
# phone code it builds from runs rustfmt, clippy for the simulator's target with warnings
# denied, and the simulator build through scripts/build-ios.sh, so the iPhone is checked
# without a `test build` label. A PR that changes only iPhone files skips the desktop and
# Android workflows (their paths exclude them) and runs this one. Setup follows ios-ipa.yml,
# which builds the device IPA, and its libmpv cache key is the same.
on:
  pull_request:
    paths:
      - 'apps/android/ios/**'
      - 'apps/android/src/**'
      - 'apps/android/ui/**'
      - 'apps/android/scripts/*ios*'
      - 'apps/android/scripts/fetch-mpv-ios.sh'
      - 'apps/android/companion/**'
      - 'apps/android/Cargo.toml'
      - 'apps/android/Cargo.lock'
      - 'apps/android/build.rs'
      # What the phone links: the core, which carries the contract, and host-api.
      - 'contract/**'
      - 'core/**'
      - 'host-api/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ios.yml'
      # Android's own file, cfg'd out of the iPhone build (#950). Later patterns win.
      - '!apps/android/src/platform/android.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install
          # A runner can hold a partial toolchain without rustc (#674)
          rustup component add rustc cargo rust-std
          rustup target add aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/android
          key: ios

      # The macos-26 image's newest Xcode, the one ios-ipa.yml builds the IPA with.
      - name: Xcode and xcodegen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen

      # Unpacked libmpv archives cached on the fetch script's pin, as ios-ipa.yml does.
      - name: Cache libmpv for iOS
        uses: actions/cache@v4
        with:
          path: |
            apps/android/vendor/mpv-ios
            !apps/android/vendor/mpv-ios/zips
          key: mpv-ios-${{ hashFiles('apps/android/scripts/fetch-mpv-ios.sh') }}

      # Before clippy: the build script links libmpv.
      - name: Fetch libmpv for iOS
        run: |
          scripts/fetch-mpv-ios.sh
          rm -rf vendor/mpv-ios/zips

      # The phone workspace is not a member of the root one, so ci.yml never sees it. Its two
      # packages by name, as android.yml does.
      - run: cargo fmt --check -p anibeam-android -p anibeam-companion

      - name: Clippy (iPhone simulator)
        run: cargo clippy --locked --target aarch64-apple-ios-sim -- -D warnings

      - name: Build (simulator)
        run: scripts/build-ios.sh
