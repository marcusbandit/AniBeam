name: iOS

# The iPhone app's own checks (#950). A pull request that touches the phone's code runs
# rustfmt, clippy for the simulator's target with warnings denied, and the simulator build
# through scripts/build-ios.sh, so the iPhone is checked without a label. A PR that changes
# only iPhone files skips the Android workflow (its paths exclude them) and runs this one.
# The core, the shared crates and the root Cargo files are not in the paths: a push there
# builds no macOS job (#986), and the `full ci` label builds the IPA over them before merge.
# Setup follows ios-ipa.yml, which builds the device IPA, and its libmpv cache key is the same.
on:
  # Main saves the Rust cache that pull requests restore, as android.yml does.
  push:
    branches: [main]
    paths:
      - 'apps/phone/ios/**'
      - 'apps/phone/src/**'
      - 'apps/phone/ui/**'
      - 'apps/phone/scripts/*ios*'
      - 'apps/phone/companion/**'
      - 'apps/phone/Cargo.toml'
      - 'apps/phone/Cargo.lock'
      - 'apps/phone/build.rs'
      - 'rust-toolchain.toml'
      - '.github/workflows/ios.yml'
      # Android's own file, cfg'd out of the iPhone build (#950). Later patterns win.
      - '!apps/phone/src/platform/android.rs'
  pull_request:
    paths:
      - 'apps/phone/ios/**'
      - 'apps/phone/src/**'
      - 'apps/phone/ui/**'
      - 'apps/phone/scripts/*ios*'
      - 'apps/phone/companion/**'
      - 'apps/phone/Cargo.toml'
      - 'apps/phone/Cargo.lock'
      - 'apps/phone/build.rs'
      - 'rust-toolchain.toml'
      - '.github/workflows/ios.yml'
      # PRs opened before the move (#1309) still list apps/android; drop once they merge main.
      - 'apps/android/ios/**'
      - 'apps/android/src/**'
      - 'apps/android/ui/**'
      - 'apps/android/scripts/*ios*'
      - 'apps/android/companion/**'
      - 'apps/android/Cargo.toml'
      - 'apps/android/Cargo.lock'
      - 'apps/android/build.rs'
      # Android's own file, cfg'd out of the iPhone build (#950). Later patterns win.
      - '!apps/phone/src/platform/android.rs'
      - '!apps/android/src/platform/android.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Its own fast job, as in android.yml, so a formatting slip fails in seconds instead of after
  # the macOS setup. The phone workspace is not a member of the root one, so ci.yml never sees
  # it, and on an iPhone-only PR android.yml does not run. Its two packages by name.
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install
          # A runner can hold a partial toolchain without rustc (#674)
          rustup component add rustc cargo rust-std

      - run: cargo fmt --check -p anibeam-android -p anibeam-companion

  ios:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install
          # A runner can hold a partial toolchain without rustc (#674)
          rustup component add rustc cargo rust-std
          rustup target add aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/phone
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The macos-26 image's newest Xcode, the one ios-ipa.yml builds the IPA with.
      - name: Xcode and xcodegen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen

      # Unpacked libmpv archives cached on the fetch script's pin, as ios-ipa.yml does. Only
      # main saves it (#986); a pull request restores what main or the nightly's IPA saved.
      - name: Cache libmpv for iOS
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: |
            apps/phone/vendor/mpv-ios
            !apps/phone/vendor/mpv-ios/zips
          key: mpv-ios-${{ hashFiles('apps/phone/scripts/fetch-mpv-ios.sh') }}

      - name: Restore libmpv for iOS
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/phone/vendor/mpv-ios
            !apps/phone/vendor/mpv-ios/zips
          key: mpv-ios-${{ hashFiles('apps/phone/scripts/fetch-mpv-ios.sh') }}

      # Before clippy: the build script links libmpv.
      - name: Fetch libmpv for iOS
        run: |
          scripts/fetch-mpv-ios.sh
          rm -rf vendor/mpv-ios/zips

      - name: Clippy (iPhone simulator)
        run: cargo clippy --locked --target aarch64-apple-ios-sim -- -D warnings

      - name: Build (simulator)
        run: scripts/build-ios.sh
