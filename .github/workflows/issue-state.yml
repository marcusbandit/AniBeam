name: Issue state

# Keeps the "in progress" and "in review" labels true (docs/agents/issue-tracker.md, "Issue
# state"), so an issue says where its work stands without anyone remembering to say it:
#
#   branch <type>/<n>-<slug> pushed       -> #n gets "in progress"
#   PR opened as a draft, or made a draft -> its closing issues get "in progress"
#   PR opened or marked ready             -> its closing issues get "in review"
#   PR closed without merging             -> its closing issues go back to "in progress"
#   PR merged with "Part of #n"           -> #n gets a comment naming the PR, and stays open
#   branch deleted                        -> #n loses "in progress" unless a PR still has it
#   issue closed                          -> both labels come off
#
# The board's Status follows these labels through the daily issue sweep on banditbox, since
# GITHUB_TOKEN cannot write to a user's project. pull_request_target, because a PR from a
# fork gets a read-only token under pull_request; this job never checks out the PR's code.
on:
  create:
  delete:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed, edited]
  issues:
    types: [closed]

permissions:
  issues: write
  pull-requests: read
  contents: read

concurrency:
  group: issue-state-${{ github.event.pull_request.number || github.event.issue.number || github.event.ref }}
  cancel-in-progress: false

jobs:
  state:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      ACTION: ${{ github.event.action }}
      REF: ${{ github.event.ref }}
      REF_TYPE: ${{ github.event.ref_type }}
      PR: ${{ github.event.pull_request.number }}
      DRAFT: ${{ github.event.pull_request.draft }}
      MERGED: ${{ github.event.pull_request.merged }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - run: |
          open_issue() {
            [ "$(gh api "repos/$GH_REPO/issues/$1" --jq 'if .pull_request then "pr" else .state end' 2> /dev/null)" = open ]
          }
          set_state() { # issue, label to add or "", labels to remove...
            local n="$1" add="$2"; shift 2
            open_issue "$n" || return 0
            args=()
            [ -n "$add" ] && args+=(--add-label "$add")
            for r in "$@"; do args+=(--remove-label "$r"); done
            gh issue edit "$n" "${args[@]}" > /dev/null
            echo "#$n: +${add:-none} -$*"
          }
          branch_issue() { sed -nE 's#^[a-z]+/([0-9]+)-.*#\1#p' <<<"$1"; }
          closing() { # GitHub fills the link list a moment after the PR opens, so look a few times
            for wait in 0 5 10; do
              sleep "$wait"
              list="$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')"
              [ -n "$list" ] && break
            done
            echo "$list"
          }

          case "$EVENT" in
            create)
              [ "$REF_TYPE" = branch ] || exit 0
              n="$(branch_issue "$REF")"
              [ -n "$n" ] && set_state "$n" "in progress"
              ;;
            delete)
              [ "$REF_TYPE" = branch ] || exit 0
              n="$(branch_issue "$REF")"
              [ -n "$n" ] || exit 0
              # An open PR on another branch may still carry the issue.
              if gh pr list --state open --search "$n in:body" --json body --jq '.[].body' \
                  | grep -qiE "\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#$n\b"; then
                exit 0
              fi
              set_state "$n" "" "in progress"
              ;;
            pull_request_target)
              case "$ACTION" in
                opened|reopened|ready_for_review|edited|converted_to_draft)
                  if [ "$DRAFT" = true ]; then add="in progress" drop="in review"
                  else add="in review" drop="in progress"; fi
                  for n in $(closing); do set_state "$n" "$add" "$drop"; done
                  ;;
                closed)
                  if [ "$MERGED" = true ]; then
                    body="$(gh pr view "$PR" --json body --jq .body)"
                    for n in $(grep -oiE '\bpart of #[0-9]+' <<<"$body" | grep -oE '[0-9]+$' | sort -u); do
                      open_issue "$n" || continue
                      gh issue comment "$n" --body "#$PR landed part of this on main. What is left stays open here."
                      set_state "$n" "" "in review"
                    done
                  else
                    for n in $(closing); do set_state "$n" "in progress" "in review"; done
                  fi
                  ;;
              esac
              ;;
            issues)
              labels="$(gh issue view "$ISSUE" --json labels --jq '.labels[].name')"
              grep -qxE 'in progress|in review' <<<"$labels" || exit 0
              gh issue edit "$ISSUE" --remove-label "in progress" --remove-label "in review" > /dev/null
              echo "#$ISSUE closed: state labels removed"
              ;;
          esac
