name: macOS

# Builds AniBeam.app for Apple silicon on a macos-15 runner, with qbittorrent-nox and anirss
# (and a Python to run it) inside, runs the core and shell tests there, smoke-tests the
# bundle and both helpers with Homebrew moved out of reach, including the Downloads page
# starting them on a fresh install. release.yml calls it for a version tag and puts
# the .dmg on the draft release. A pull request that touches the core, the Qt shell or the
# workspace runs it too, so a change that breaks the Mac shows up before it merges. Run it
# from the Actions tab (Run workflow) for a build without a release.
on:
  pull_request:
    paths:
      - 'core/**'
      - 'apps/linux/**'
      - 'apps/cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
  CARGO_TERM_COLOR: always
  # The project's own AniList and MAL app registrations, so a release signs in with one
  # click. Empty on a fork's pull request, whose build then asks for a client ID instead.
  ANIBEAM_ANILIST_CLIENT_ID: ${{ secrets.ANIBEAM_ANILIST_CLIENT_ID }}
  ANIBEAM_MAL_CLIENT_ID: ${{ secrets.ANIBEAM_MAL_CLIENT_ID }}

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe names the version

      - name: Homebrew packages
        run: |
          brew install qtbase qtdeclarative qtsvg qttools qtshadertools \
            ffmpeg libass libplacebo little-cms2 uchardet zimg \
            meson ninja pkgconf cmake extra-cmake-modules \
            boost openssl@3
          qmake="$(brew --prefix qtbase)/bin/qmake"
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"
          echo "DEPS_PREFIX=$HOME/anibeam-deps" >> "$GITHUB_ENV"
          echo "MPVQT_PREFIX=$HOME/anibeam-deps" >> "$GITHUB_ENV"
          echo "MPV_PREFIX=$HOME/anibeam-deps" >> "$GITHUB_ENV"
          brew list --versions qtbase qtdeclarative qtsvg qttools ffmpeg libass libplacebo \
            boost openssl@3
          "$qmake" -query

      - name: Dependency cache key
        id: depkey
        run: |
          key="$( { cat apps/linux/packaging/macos/deps.sh
                    brew list --versions ffmpeg libass libplacebo little-cms2 uchardet zimg qtbase qtdeclarative \
                      qtsvg qttools boost openssl@3
                  } | shasum -a 256 | cut -c1-16)"
          echo "key=macos-15-deps-$key" >> "$GITHUB_OUTPUT"

      - name: Restore libmpv and MpvQt
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: ~/anibeam-deps
          key: ${{ steps.depkey.outputs.key }}

      - name: Build libmpv and MpvQt
        if: steps.deps.outputs.cache-hit != 'true'
        run: apps/linux/packaging/macos/deps.sh "$DEPS_PREFIX"

      # Saved here rather than at the end, so a run that fails later keeps them.
      - name: Save libmpv and MpvQt
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/anibeam-deps
          key: ${{ steps.depkey.outputs.key }}

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked -p anibeam -p anibeam-cli

      # Read through the core the app links, without printing the IDs themselves.
      - name: The build carries the tracker app IDs
        if: env.ANIBEAM_ANILIST_CLIENT_ID != ''
        run: |
          root="$(mktemp -d)"
          target/release/anibeam-cli --root "$root" call GetTrackers > "$root/trackers.json"
          python3 - "$root/trackers.json" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1]))["Trackers"]["state"]
          missing = [t for t in ("anilist", "mal") if not state[t]["bundled_credentials"]]
          assert not missing, f"no bundled client ID for {missing}"
          print("bundled client IDs: anilist, mal")
          PY

      - name: Test the core and the shell
        run: cargo test --locked -p anibeam-core -p anibeam

      - name: Bundle
        run: apps/linux/packaging/macos/bundle.sh dist

      - name: Smoke test with Homebrew out of reach
        run: |
          smoke=apps/linux/packaging/macos/smoke.sh
          SMOKE_SEED_ONLY=1 "$smoke" dist/AniBeam.app target/release/anibeam-cli smoke
          otool -L target/release/anibeam-cli
          sudo mv /opt/homebrew /opt/homebrew-hidden
          mv "$DEPS_PREFIX" "$DEPS_PREFIX-hidden"
          status=0
          /usr/bin/python3 apps/linux/packaging/macos/fix-dylibs.py dist/AniBeam.app --check || status=1
          "$smoke" dist/AniBeam.app target/release/anibeam-cli smoke || status=1
          mv "$DEPS_PREFIX-hidden" "$DEPS_PREFIX"
          sudo mv /opt/homebrew-hidden /opt/homebrew
          exit "$status"

      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anibeam-macos-arm64
          path: dist/*.dmg
          if-no-files-found: ignore

      - name: Upload the smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-captures-macos
          path: |
            smoke/*.png
            smoke/*.log
            smoke/*.json
            smoke/drive/*.png
            smoke/downloads-drive/*.png
            smoke/downloads-state/**
            ~/Library/Logs/DiagnosticReports/anibeam*.ips
          if-no-files-found: ignore
