name: Nightly

# What main is becoming, as a build of its own. A nightly is the frontier channel, not a
# daily timer: it is cut on demand, by running this workflow, when main holds something worth
# trying. It builds only when the app changed on main since the last nightly; `force` builds
# regardless. Each nightly is versioned from the workspace version, 2.5.0-nightly.20261030.12
# (the day and this workflow's run number), and published as the pre-release
# v2.5.0-nightly.20261030.12 once every platform's files are on it. An app on the Nightly
# track hears about it; the Stable track never does. release.yml promotes the newest nightly
# to a stable version. The ten newest nightlies are kept. CONTRIBUTING.md, under Releases,
# has the whole line.
#
# The phone rides the same train under its own number: when the phone or what it builds on
# changed since its last nightly, the same run builds its APK from apps/android/Cargo.toml's
# version, 2.4.3-nightly.20261030.12, and publishes it as android-v2.4.3-nightly.20261030.12,
# with the iPhone's unsigned IPA (AniBeam-2.4.3-nightly.20261030.12.ipa) when that built too.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the apps have not changed on main since their last nightlies
        type: boolean
        default: false

# One nightly at a time; a second run waits for the first.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      sha: ${{ steps.gate.outputs.sha }}
      version: ${{ steps.gate.outputs.version }}
      previous: ${{ steps.gate.outputs.previous }}
      phone: ${{ steps.gate.outputs.phone }}
      phone_version: ${{ steps.gate.outputs.phone_version }}
      phone_previous: ${{ steps.gate.outputs.phone_previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Is a nightly due
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          sha="$(git rev-parse HEAD)"
          base="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          version="$base-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          last="$(gh release list --limit 100 --exclude-drafts --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9.]+-nightly\\."))] | sort_by(.createdAt) | last // empty | "\(.tagName) \(.createdAt)"')"
          build=true
          if [ -n "$last" ]; then
            read -r tag _ <<<"$last"
            echo "previous=$tag" >> "$GITHUB_OUTPUT"
            git fetch -q origin "refs/tags/$tag:refs/tags/$tag"
            if git diff --quiet "$tag" "$sha" -- contract core host-api apps/linux apps/cli Cargo.toml Cargo.lock; then
              echo "The app has not changed on main since $tag."
              build=false
            fi
          fi
          if [ "$FORCE" = true ]; then build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build=$build, $version at ${sha::7}"

          # The phone: its own version and its own last nightly. Its first nightly's notes
          # start at its newest release made by hand.
          phone_base="$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/android/Cargo.toml | head -n1)"
          phone_version="$phone_base-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          echo "phone_version=$phone_version" >> "$GITHUB_OUTPUT"
          tags="$(gh release list --limit 100 --exclude-drafts --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("android-v"))] | sort_by(.createdAt) | .[].tagName')"
          last="$(grep -E '^android-v[0-9.]+-nightly\.' <<<"$tags" | tail -n1 || true)"
          phone=true
          if [ -n "$last" ]; then
            echo "phone_previous=$last" >> "$GITHUB_OUTPUT"
            git fetch -q origin "refs/tags/$last:refs/tags/$last"
            if git diff --quiet "$last" "$sha" -- apps/android contract core host-api recs Cargo.toml Cargo.lock rust-toolchain.toml; then
              echo "The phone has not changed on main since $last."
              phone=false
            fi
          else
            hand="$(grep -E '^android-v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | sort -V | tail -n1 || true)"
            if [ -n "$hand" ]; then echo "phone_previous=$hand" >> "$GITHUB_OUTPUT"; fi
          fi
          if [ "$FORCE" = true ]; then phone=true; fi
          echo "phone=$phone" >> "$GITHUB_OUTPUT"
          echo "phone=$phone, $phone_version at ${sha::7}"

  macos:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    with:
      ref: ${{ needs.gate.outputs.sha }}
      version: ${{ needs.gate.outputs.version }}

  linux:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    with:
      ref: ${{ needs.gate.outputs.sha }}
      version: ${{ needs.gate.outputs.version }}

  windows:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      ref: ${{ needs.gate.outputs.sha }}
      version: ${{ needs.gate.outputs.version }}

  android:
    needs: gate
    if: needs.gate.outputs.phone == 'true'
    uses: ./.github/workflows/android-apk.yml
    secrets: inherit
    with:
      ref: ${{ needs.gate.outputs.sha }}
      version: ${{ needs.gate.outputs.phone_version }}

  # The phone's unsigned IPA, for AltStore, SideStore and LiveContainer to sign. It rides the
  # phone's nightly; a failed IPA build never holds the APK back.
  ios:
    needs: gate
    if: needs.gate.outputs.phone == 'true'
    uses: ./.github/workflows/ios-ipa.yml
    secrets: inherit
    with:
      ref: ${{ needs.gate.outputs.sha }}
      version: ${{ needs.gate.outputs.phone_version }}

  publish:
    needs: [gate, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: anibeam-*
          merge-multiple: true
          path: dist

      # A draft first, made public only once every file is on it, so an app that checks
      # meanwhile never finds a nightly without its download.
      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
          PREVIOUS: ${{ needs.gate.outputs.previous }}
        run: |
          ls -la dist
          tag="v$VERSION"
          {
            echo "A nightly build of main at ${SHA::7}: what the next stable version is becoming, not yet checked the way a release is. Turn on Settings > Data > Updates > Nightly to hear about the next one."
            echo
            sed "s/@VERSION@/$VERSION/g" .github/release-notes.md | sed '/^\*\*Arch:\*\*/d'
          } > notes.md
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$tag" dist/* --draft --prerelease --latest=false --target "$SHA" \
            --title "$(.github/release-name.sh "$VERSION")" --notes-file notes.md --generate-notes "${start[@]}"
          gh release edit "$tag" --draft=false --prerelease --latest=false

      - name: Keep the ten newest nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --exclude-drafts --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9.]+-nightly\\."))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r tag; do
              echo "Removing $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done

  # The phone's nightly, its own pre-release the way the desktop's is: a draft until the APK
  # is on it.
  publish-phone:
    needs: [gate, android, ios]
    # The IPA is optional: only the APK build has to succeed.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: phone-apk
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.ios.result == 'success'
        with:
          name: phone-ipa
          path: ipa

      - name: Name the IPA for this nightly
        if: needs.ios.result == 'success'
        env:
          VERSION: ${{ needs.gate.outputs.phone_version }}
        run: mv ipa/AniBeam.ipa "dist/AniBeam-$VERSION.ipa"

      - name: Publish the phone's nightly
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.phone_version }}
          SHA: ${{ needs.gate.outputs.sha }}
          PREVIOUS: ${{ needs.gate.outputs.phone_previous }}
        run: |
          ls -la dist
          tag="android-v$VERSION"
          {
            echo "A nightly build of the phone app from main at ${SHA::7}: what the next phone version is becoming, not yet checked the way a release is."
            echo
            sed "s/@VERSION@/$VERSION/g" .github/release-notes-android.md
          } > notes.md
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          # The IPA is there when its build succeeded; no match must not reach gh as a name.
          shopt -s nullglob
          files=(dist/*.apk dist/*.ipa)
          gh release create "$tag" "${files[@]}" --draft --prerelease --latest=false --target "$SHA" \
            --title "$(.github/release-name.sh "$VERSION" phone)" --notes-file notes.md --generate-notes "${start[@]}"
          gh release edit "$tag" --draft=false --prerelease --latest=false

      - name: Keep the ten newest phone nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --exclude-drafts --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^android-v[0-9.]+-nightly\\."))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r tag; do
              echo "Removing $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done

  # The website's What's new shows what this nightly brings under Coming next, with its number
  # (#777), and its download page links the phone's nightly: deploy the site once either
  # nightly is public. The site reads which nightly is newest,
  # and the change files at its tag, from GitHub itself.
  site:
    needs: [gate, publish, publish-phone]
    if: always() && (needs.publish.result == 'success' || needs.publish-phone.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: The website shows what this nightly brings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml -R "$GITHUB_REPOSITORY" --ref main
