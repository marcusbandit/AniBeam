name: Site

# Publishes the website in site/ on GitHub Pages whenever it changes on main (#768). A pull
# request touching it only assembles the site, so a broken build.sh shows before the merge.
# site/build.sh adds the screenshots from docs/readme, so they live in one place.
# The custom domain is set in the repo's Pages settings, not in a CNAME file. The What's new
# pages come from the apps' patch notes, so a change to them deploys too, and every nightly
# and stable release deploys once it is public.
# Every deploy also signs the apt and dnf repos from the newest stable release's packages into
# /apt and /rpm (publish-repos.sh, #788), and release.yml runs this on main right after a
# stable release goes public, so the repos carry it without a commit.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/readme/**
      - assets/icon.png
      - .github/workflows/site.yml
      - apps/linux/CHANGELOG.md
      - apps/android/CHANGELOG.md
      - apps/linux/changes/**
      - apps/android/changes/**
      - apps/linux/packaging/linux/repos.sh
      - apps/linux/packaging/linux/publish-repos.sh
  pull_request:
    paths:
      - site/**
      - docs/readme/**
      - assets/icon.png
      - .github/workflows/site.yml
  workflow_dispatch:
    inputs:
      nightly:
        description: The newest nightly, 2.5.0-nightly.20261112.40, for What's new; nightly.yml fills it
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: site/build.sh "$RUNNER_TEMP/site"

  deploy:
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: site/build.sh "$RUNNER_TEMP/site"
        env:
          ANIBEAM_NIGHTLY: ${{ inputs.nightly }}
      - name: The apt and dnf repos
        env:
          GH_TOKEN: ${{ github.token }}
          ANIBEAM_REPO_GPG_KEY: ${{ secrets.ANIBEAM_REPO_GPG_KEY }}
        run: apps/linux/packaging/linux/publish-repos.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
