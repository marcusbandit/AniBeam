name: Close stale needs more info issues

# Triage labels an issue "needs more info" when it cannot reproduce the report and asks the
# reporter for what is missing (docs/agents/triage.md). This closes the issue once 7 days pass
# with no comment since the label went on. The label stays on an answered issue, because the
# triage watcher on banditbox finds answers through it; the reply pass takes it off.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9
        with:
          only-issue-labels: "needs more info"
          # Triage applies the label itself, so nothing is ever marked stale here.
          days-before-issue-stale: -1
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: false
          stale-issue-label: "needs more info"
          close-issue-reason: not_planned
          close-issue-message: >-
            Closing: no answer in 7 days after triage asked for more information.
            Comment with the missing details and triage will look at it again.
