[workspace]
resolver = "3"
members = ["core", "host-api", "apps/cli", "apps/linux"]

[workspace.package]
version = "2.4.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/marcusbandit/AniBeam"

[workspace.dependencies]
anibeam-core = { path = "core" }
anibeam-host-api = { path = "host-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "process", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1
