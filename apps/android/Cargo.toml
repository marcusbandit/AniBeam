[package]
name = "anibeam-android"
description = "Anibeam for Android: what airs next and what the host has on disk"
version = "2.4.3"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace, so the desktop workspace and its CI never build it.
[workspace]
members = [".", "companion"]
resolver = "3"

[lib]
name = "anibeam"
# The cdylib is what Android's NativeActivity loads; the rlib is what the iPhone's
# executable (src/main.rs) links.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "anibeam-ios"
path = "src/main.rs"

[dependencies]
anibeam-companion = { path = "companion" }
anibeam-core = { path = "../../core", features = ["phone", "cast"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-skia"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"

# The iPhone draws through winit, and reads the hinge, its settings and its notifications
# from UIKit and Foundation (platform/ios.rs).
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit"] }
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSError", "NSLocale", "NSNotification", "NSOperation", "NSString", "NSURL", "NSValue"] }
block2 = "0.6"

[build-dependencies]
slint-build = "1.18"

# librqbit-dualstack-sockets 0.7.0 takes its Linux path on iOS and does not build there.
# Pinned to the fix in ikatson/librqbit-dualstack-sockets#7 until a release carries it (#868).
[patch.crates-io]
librqbit-dualstack-sockets = { git = "https://github.com/zerx-lab/librqbit-dualstack-sockets", rev = "ab2d894db4115e7ed7d4e67716e395e8b85be93f" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
