[package]
name = "anibeam-android"
description = "AniBeam for Android: what airs next and what the host has on disk"
version = "2.4.3"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace, so the desktop workspace and its CI never build it.
[workspace]
members = [".", "companion"]
resolver = "3"

[lib]
name = "anibeam"
# The cdylib is what Android's NativeActivity loads; the rlib is what the iPhone's
# executable (src/main.rs) links.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "anibeam-ios"
path = "src/main.rs"

[dependencies]
anibeam-companion = { path = "companion" }
anibeam-core = { path = "../../core", features = ["phone", "cast"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-skia"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"

# The iPhone draws through winit, and reads the hinge from UIKit (platform/ios.rs).
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit"] }
objc2 = "0.6"
objc2-core-foundation = "0.3"
block2 = "0.6"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
