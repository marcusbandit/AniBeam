[package]
name = "anibeam-companion"
description = "The phone app's logic without its UI: sync with the host, the cache, the schedule"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# The word catalog and its lookup (#792); no feature of the core is needed for it.
anibeam-core = { path = "../../../core" }
anibeam-host-api = { path = "../../../host-api", features = ["proof"] }
# The device key's seed and each proof's nonce (#555).
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls with the bundled Mozilla roots: the Android trust store is only reachable from Java.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# unstable-locales: month and weekday names in the language the app speaks (#792).
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "unstable-locales"] }
