[package]
name = "anibeam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AniBeam's Linux shell: Qt 6 QML over the core, one window, libmpv inside it"
build = "build.rs"

[[bin]]
name = "anibeam"
path = "src/main.rs"

[dependencies]
anibeam-core.workspace = true
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
# `unstable` is the one gate on Server::connection(), which is how the application
# name and MPRIS end up on one connection rather than two.
mpris-server = { version = "=0.10.0", features = ["tokio", "unstable"] }
notify = "8.2"
notify-debouncer-full = "0.7"
material-colors = { version = "=0.4.2", default-features = false, features = ["std"] }
toml_edit = "0.25"
rustix = { version = "1", features = ["fs"] }
percent-encoding = "2"

[build-dependencies]
cxx-qt-build = "=0.10.0"

[dev-dependencies]
tempfile = "3"
