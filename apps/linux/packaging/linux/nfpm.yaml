# The .deb and .rpm of Anibeam, filled in by packages.sh through these environment variables:
#   ANIBEAM_PKG_VERSION  the package version: 2.4.0, or 2.4.0~nightly.20261112.40 for a pre-release
#   ANIBEAM_PKG_RELEASE  the rpm release, 1; empty for the deb, whose version is the plain version
# Paths in contents are relative to the staging tree, which packages.sh runs nfpm from:
# opt/anibeam, usr/bin/anibeam, usr/share/...
# The AppImage's AppDir lives in /opt/anibeam and /usr/bin/anibeam launches it. The in-app
# updater treats a binary under /usr or /opt as package-managed, so apt and dnf do the updating.
#
# Depends and Requires are the libraries linux.yml installs before the smoke tests on
# Debian 13 and Fedora 41: everything the bundle leaves to the host.
name: anibeam
arch: amd64
platform: linux
version: ${ANIBEAM_PKG_VERSION}
version_schema: none
release: "${ANIBEAM_PKG_RELEASE}"
section: video
priority: optional
maintainer: Anibeam <noreply@anibeam.app>
vendor: Anibeam
homepage: https://anibeam.app
license: GPL-3.0-or-later
description: Your anime folder, as a library you can watch and track.

contents:
  - src: ./opt/anibeam
    dst: /opt/anibeam
    type: tree
  - src: ./usr/bin/anibeam
    dst: /usr/bin/anibeam
    file_info:
      mode: 0755
  - src: ./usr/share/applications/com.marcusrosado.AniBeam.desktop
    dst: /usr/share/applications/com.marcusrosado.AniBeam.desktop
    file_info:
      mode: 0644
  - src: ./usr/share/icons/hicolor/512x512/apps/com.marcusrosado.AniBeam.png
    dst: /usr/share/icons/hicolor/512x512/apps/com.marcusrosado.AniBeam.png
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - ca-certificates
      - libgl1-mesa-dri
      - libgl1
      - libegl1
      - libglx-mesa0
      - libxkbcommon-x11-0
      - libxcb-cursor0
      - libfontconfig1
      - libfreetype6
      - libharfbuzz0b
      - libasound2t64 | libasound2
      - libfribidi0
      - libgmp10
      - libexpat1
      - libgpg-error0
      - libdrm2
      - libgbm1
      - libcom-err2
      - libuuid1
      - libssl3t64 | libssl3
  rpm:
    depends:
      - ca-certificates
      - mesa-dri-drivers
      - mesa-libEGL
      - mesa-libGL
      - libxkbcommon-x11
      - xcb-util-cursor
      - libva
      - fontconfig
      - freetype
      - harfbuzz
      - alsa-lib
      - fribidi
      - gmp
      - expat
      - libdrm
      - mesa-libgbm
      - libcom_err
      - libgpg-error
      - libuuid
      - openssl-libs
