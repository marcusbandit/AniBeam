[package]
name = "anibeam-relay"
description = "The native watch together relay: rooms in memory, over WebSocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "anibeam_relay"

[[bin]]
name = "anibeam-relay"
path = "src/main.rs"

[dependencies]
anibeam-room.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
getrandom = "0.3"

[dev-dependencies]
# The same tokio-tungstenite axum's `ws` uses, as the tests' WebSocket client.
tokio-tungstenite = "0.29"
futures-util = "0.3"
