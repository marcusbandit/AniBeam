[package]
name = "anibeam-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AniBeam's core: every rule in one crate, used by every shell"
build = "build.rs"

[lib]
name = "anibeam_core"
crate-type = ["lib"]

[dependencies]
uniffi = "=0.32.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "serde_json", "backup"] }
rusqlite_migration = "2.6"
directories = "6"
notify = "8.2"
notify-debouncer-full = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
governor = "0.10"
backon = { version = "1.6", features = ["tokio-sleep"] }
keyring-core = "1.0"
regex = "1"
# anirss's title patterns use lookaround, which `regex` does not do.
fancy-regex = "0.14"
sha2 = "0.11"
walkdir = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rand = "0.10"
base64 = "0.23"
tracing = "0.1"
flate2 = "1"
toml = "1"
roxmltree = "0.20"
anibeam-host-api.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
if-addrs = "0.13"
rustix = { version = "1", features = ["system"] }
# The phone's torrent engine; only the Android app turns it on.
librqbit = { version = "9", default-features = false, features = ["rust-tls"], optional = true }

[features]
phone = ["dep:librqbit"]

# The machine's keyring: the Secret Service over D-Bus everywhere but a Mac, the login
# keychain there. `keychain` rather than `protected`: the protected store needs a
# provisioning profile, and the Mac build is ad-hoc signed.
[target.'cfg(not(target_os = "macos"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", default-features = false, features = ["keychain"] }

[dev-dependencies]
tempfile = "3"

# The desktop's trash; a phone deletes its own files outright.
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"

[target.'cfg(target_os = "android")'.dependencies]
# Fronted requests keep DDoS-Guard's cookies (net/mod.rs, Front).
reqwest = { version = "0.13", default-features = false, features = ["cookies"] }
webpki-root-certs = "1"
