[package]
name = "anibeam-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AniBeam's core: every rule in one crate, used by every shell"
build = "build.rs"

[lib]
name = "anibeam_core"
crate-type = ["lib"]

[dependencies]
uniffi = "=0.32.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "serde_json", "backup"] }
rusqlite_migration = "2.6"
directories = "6"
notify = "8.2"
notify-debouncer-full = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
governor = "0.10"
backon = { version = "1.6", features = ["tokio-sleep"] }
keyring-core = "1.0"
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }
regex = "1"
sha2 = "0.11"
walkdir = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rand = "0.10"
base64 = "0.23"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
