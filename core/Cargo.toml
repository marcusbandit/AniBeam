[package]
name = "anibeam-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anibeam's core: every rule in one crate, used by every shell"
build = "build.rs"

[lib]
name = "anibeam_core"
crate-type = ["lib"]

[dependencies]
uniffi.workspace = true
anibeam-contract = { workspace = true, features = ["sqlite"] }
anibeam-foundation.workspace = true
anibeam-net.workspace = true
anibeam-library.workspace = true
anibeam-releases.workspace = true
anibeam-metadata.workspace = true
anibeam-trackers.workspace = true
anibeam-downloads.workspace = true
anibeam-playback.workspace = true
anibeam-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite = { workspace = true, features = ["bundled", "serde_json"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
base64 = "0.23"
# Endpoint repos (#143): the ed25519 check on a repo's signed index.
ed25519-dalek = "2"
flate2 = "1"
anibeam-host-api = { workspace = true, features = ["proof"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[features]
phone = ["anibeam-downloads/phone", "anibeam-trackers/phone"]
cast = ["anibeam-playback/cast"]

[dev-dependencies]
tempfile = "3"
# The native relay, run in-process by the rooms tests.
anibeam-relay = { path = "../apps/relay" }

[[example]]
name = "cast_hls"
required-features = ["cast"]

[[example]]
name = "cast_serve"
required-features = ["cast"]

[[example]]
name = "cast_drive"
required-features = ["cast"]
