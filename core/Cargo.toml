[package]
name = "anibeam-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anibeam's app team: the Core every shell opens, its call router, launch and update, and the uniffi export, over the team crates"
build = "build.rs"

# Files outside this folder the tests read, so a change to one checks the core and what builds
# on it (.github/affected-crates.py): the apps' patch notes and their versions
# (tests/changelog.rs). The anirss pins in the packaging are the downloads crate's.
[package.metadata.ci]
reads = [
  "../.github/changelog-fold.sh",
  "../apps/linux/CHANGELOG.md",
  "../apps/linux/changes",
  "../apps/android/CHANGELOG.md",
  "../apps/android/changes",
  "../apps/android/Cargo.toml",
  "../apps/android/android/AndroidManifest.xml",
]

[lib]
name = "anibeam_core"
crate-type = ["lib"]

[dependencies]
uniffi.workspace = true
anibeam-contract = { workspace = true, features = ["sqlite"] }
anibeam-foundation.workspace = true
anibeam-net.workspace = true
anibeam-library.workspace = true
anibeam-releases.workspace = true
anibeam-metadata.workspace = true
anibeam-trackers.workspace = true
anibeam-downloads.workspace = true
anibeam-playback.workspace = true
anibeam-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite = { workspace = true, features = ["bundled", "serde_json"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# The phone's torrent engine, the one downloads runs: core/tests/phone_unsubscribe.rs makes
# its test torrents with it. A dev-dependency cannot wait for the phone feature.
librqbit = { version = "9", default-features = false, features = ["rust-tls"], optional = true }

[features]
phone = ["anibeam-downloads/phone", "anibeam-trackers/phone", "dep:librqbit"]
cast = ["anibeam-playback/cast"]

[dev-dependencies]
tempfile = "3"
# The native relay, run in-process by the rooms tests.
anibeam-relay = { path = "../apps/relay" }
# What the integration tests make their inputs with: a signed endpoint repo and its base64 key
# (#143), a signed host request (#555), and the gzipped IMDb data.
base64 = "0.23"
ed25519-dalek = "2"
flate2 = "1"
anibeam-host-api = { workspace = true, features = ["proof"] }

[[example]]
name = "cast_hls"
required-features = ["cast"]

[[example]]
name = "cast_serve"
required-features = ["cast"]

[[example]]
name = "cast_drive"
required-features = ["cast"]
