[package]
name = "anibeam-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anibeam's host team: the tailnet host the phone reads, its keys, trust, history, conversions and streams, and the library's export and import"

[lib]
name = "anibeam_host"
crate-type = ["lib"]

[dependencies]
anibeam-contract = { workspace = true, features = ["sqlite"] }
anibeam-foundation.workspace = true
anibeam-net.workspace = true
anibeam-library.workspace = true
anibeam-releases.workspace = true
anibeam-metadata.workspace = true
anibeam-trackers.workspace = true
anibeam-downloads.workspace = true
anibeam-host-api = { workspace = true, features = ["proof"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
rusqlite.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing"] }
rand = "0.10"
tracing = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# Pausing and resuming a host conversion with STOP and CONT.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
