[package]
name = "anibeam-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anibeam's library team: the scans, the folder walk and the watcher, and the reads that turn the tables into cards"
build = "build.rs"

[lib]
name = "anibeam_library"
crate-type = ["lib"]

[dependencies]
anibeam-contract = { workspace = true, features = ["sqlite"] }
anibeam-foundation.workspace = true
anibeam-net.workspace = true
anibeam-host-api.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
notify = "8.2"
notify-debouncer-full = "0.7"
regex = "1"
time = "0.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

# The desktop's trash; a phone (Android or iPhone) deletes its own files outright. Cargo's
# target tables cannot read build.rs's `phone_os`, so they name the phone's systems.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"
