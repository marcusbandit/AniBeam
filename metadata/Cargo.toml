[package]
name = "anibeam-metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anibeam's metadata team: matching and fetching, the franchise graph, Recommended, Airing now, the aired episodes and the calendar feed"

[lib]
name = "anibeam_metadata"
crate-type = ["lib"]

[dependencies]
anibeam-contract = { workspace = true, features = ["sqlite"] }
anibeam-foundation.workspace = true
anibeam-net.workspace = true
anibeam-library.workspace = true
anibeam-recs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
regex = "1"
time = { version = "0.3", features = ["parsing", "macros"] }
tracing = "0.1"
