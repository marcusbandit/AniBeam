[package]
name = "anibeam-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anibeam's network team: one client per provider behind the shared limiter, and the image cache"
build = "build.rs"

[lib]
name = "anibeam_net"
crate-type = ["lib"]

[dependencies]
anibeam-contract.workspace = true
anibeam-foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
backon = { version = "1.6", features = ["tokio-sleep"] }
tracing = "0.1"
time = { version = "0.3", features = ["parsing"] }
sha2 = "0.11"
rand = "0.10"
flate2 = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Fronted requests keep the bot shield's cookies (lib.rs, Front).
reqwest = { version = "0.13", default-features = false, features = ["cookies"] }

# Android's bundled TLS roots (lib.rs): its platform verifier needs JNI.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
