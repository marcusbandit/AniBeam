[package]
name = "anibeam-playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anibeam's playback team: the session rules, tracks and skip times, Discord presence, casting, and the watch together room"
build = "build.rs"

[lib]
name = "anibeam_playback"
crate-type = ["lib"]

[dependencies]
anibeam-contract = { workspace = true, features = ["sqlite"] }
anibeam-foundation.workspace = true
anibeam-net.workspace = true
anibeam-library.workspace = true
anibeam-releases.workspace = true
anibeam-metadata.workspace = true
anibeam-trackers.workspace = true
anibeam-downloads.workspace = true
anibeam-room.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
rusqlite.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
regex = "1"
sha2 = "0.11"
rand = "0.10"
base64 = "0.23"
tracing = "0.1"
# Watch together rooms (#846): the relay's WebSocket, opened through reqwest's own client
# and HTTP upgrade so it rides the same TLS setup as every other request.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Get media (#889): what the host passes a member is sealed end to end, an X25519 agreement
# per pair and XChaCha20-Poly1305 under a key HKDF draws from it, so the relay forwards bytes
# it cannot read.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.13"
# Casting: the Matroska reader for cutting segments and zlib for its compressed tracks, mDNS
# for finding Chromecasts and rustls for their TLS, the server a device reads from, the DLNA
# replies' XML, and the HLS playlist the host writes too (#1059). Only the shells that cast
# turn it on.
matroska-demuxer = { version = "0.8", optional = true }
flate2 = { version = "1", optional = true }
mdns-sd = { version = "0.21", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"], optional = true }
futures-core = { version = "0.3", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"], optional = true }
roxmltree = { version = "0.20", optional = true }
anibeam-host-api = { workspace = true, optional = true }

[features]
# Casting (cast/). The core's `cast` turns it on.
cast = ["dep:matroska-demuxer", "dep:flate2", "dep:mdns-sd", "dep:rustls", "dep:futures-core", "dep:axum", "dep:roxmltree", "dep:anibeam-host-api"]

# Peeks at Discord's named pipe for events without blocking (#966).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3"
