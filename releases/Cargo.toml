[package]
name = "anibeam-releases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anibeam's releases team: anirss's release logic, what a release title says, the endpoint repos and the Feed page"

[lib]
name = "anibeam_releases"
crate-type = ["lib"]

[dependencies]
anibeam-contract = { workspace = true, features = ["sqlite"] }
anibeam-foundation.workspace = true
anibeam-net.workspace = true
anibeam-library.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
regex = "1"
# anirss's title patterns use lookaround, which `regex` does not do.
fancy-regex = "0.14"
roxmltree = "0.20"
sha2 = "0.11"
rand = "0.10"
base64 = "0.23"
# Endpoint repos (#143): the ed25519 check on a repo's signed index.
ed25519-dalek = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
