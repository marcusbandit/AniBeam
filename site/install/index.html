<script>
// ?to=altstore|sidestore|livecontainer with one of
//   &source=1                adds the site's one source (altstore/source.json, Anibeam and Anibeam Nightly) to the app,
//   &channel=stable|nightly  installs the IPA the site's releases.json lists for that channel once,
//   &url=<IPA url>           installs that IPA once (a PR test build).
// Only the site's own source and an IPA on this project's releases are passed on, so the page cannot
// send anyone to another address. AltStore, SideStore and LiveContainer each take
// <scheme>://source?url=<source> to add a source and AltStore and SideStore <scheme>://install?url=<ipa>
// to install one IPA.
const SCHEMES = { altstore: "altstore", sidestore: "sidestore", livecontainer: "livecontainer" };
const KEYS = { stable: "phone", nightly: "phone_nightly" };
const PREFIX = "https://github.com/marcusbandit/Anibeam/releases/download/";
const SOURCE = "https://anibeam.app/altstore/source.json";
const okIpa = (ipa) => typeof ipa === "string" && ipa.startsWith(PREFIX) && ipa.endsWith(".ipa") && !/[\s<>"]/.test(ipa);
const done = (ipa, scheme) => okIpa(ipa)
  ? { ipa, redirect: scheme + "://install?url=" + encodeURIComponent(ipa) }
  : { error: "That is not an Anibeam IPA link." };
const source = (scheme) => ({ feed: SOURCE, redirect: scheme + "://source?url=" + encodeURIComponent(SOURCE) });
// What is wanted: from the address (url=), or from the release list (channel=, source=), null until it is read.
function wanted(search) {
  const q = new URLSearchParams(search);
  const scheme = SCHEMES[q.get("to")];
  if (!scheme) return { error: "Unknown app. Use AltStore, SideStore or LiveContainer." };
  if (q.has("source")) return source(scheme);
  if (q.get("url")) return done(q.get("url"), scheme);
  const key = KEYS[q.get("channel")];
  if (!key) return { error: "That is not an Anibeam IPA link." };
  return { scheme, key, channel: q.get("channel") };
}
function fromReleases(w, releases) {
  const rel = releases && releases[w.key];
  const ipa = rel && rel.assets && rel.assets.ipa;
  if (!ipa) return { none: true, channel: w.channel };
  return done(ipa, w.scheme);
}
if (typeof document !== "undefined") {
  const msg = document.getElementById("msg");
  const dl = document.getElementById("dl");
  const src = document.getElementById("src");
  const go = (r) => {
    if (r.error) { msg.textContent = r.error; return; }
    if (r.none) {
      msg.textContent = "There is no " + r.channel + " iPhone build yet. Check the download page later.";
      dl.textContent = "Open the download page";
      dl.hidden = false;
      return;
    }
    if (r.feed) {
      // The source address, to paste into the app's Sources screen when its link does not open.
      msg.textContent = "Opening the app to add the Anibeam source. If nothing happens, install the app first, or paste this address into its Sources screen:";
      src.querySelector("code").textContent = r.feed;
      src.querySelector(".copy").dataset.copy = r.feed;
      src.hidden = false;
    } else {
      msg.textContent = "Opening the app. If nothing happens, install it first, or download the IPA and open it there.";
    }
    if (r.ipa) {
      dl.href = r.ipa;
      dl.hidden = false;
    }
    location.href = r.redirect;
  };
  const w = wanted(location.search);
  if (!w.key) go(w);
  else fetch("../releases.json").then((r) => (r.ok ? r.json() : null)).catch(() => null).then((j) => go(fromReleases(w, j)));
}
</script>
