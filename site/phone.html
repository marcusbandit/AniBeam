<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone layouts</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 32px 24px 64px; }
  .opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 14px; color: var(--fg); font-size: 20px; font-weight: 660; letter-spacing: -0.02em; }
  figcaption span { color: var(--brand); margin-right: 8px; }
  iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 36px; background: #07080a; box-shadow: 0 0 0 10px #16171b, 0 0 0 11px rgba(255, 255, 255, 0.1), 0 40px 80px -30px #000; }
</style>
</head>
<body>
<div class="opts">
  <figure><figcaption><span>A</span>Flow</figcaption><iframe src="./?m=flow#features" title="Flow"></iframe></figure>
  <figure><figcaption><span>B</span>Swipe</figcaption><iframe src="./?m=swipe#features" title="Swipe"></iframe></figure>
  <figure><figcaption><span>C</span>List</figcaption><iframe src="./?m=list#features" title="List"></iframe></figure>
</div>
</body>
</html>
