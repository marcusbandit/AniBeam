[package]
name = "anibeam-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Throwaway spike: a Cargo-only cxx-qt app packaged through a PKGBUILD (wayfinder #10)"
license = "MIT"

[dependencies]
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"

