[package]
name = "anibeam-proto"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Throwaway prototype: the home grid in QML with the theme knobs live (wayfinder #17)"
license = "MIT"

[dependencies]
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
glob = "0.3"

[build-dependencies]
cxx-qt-build = "=0.10.0"
